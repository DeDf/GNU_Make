name: Build GNU Make with w64devkit v2.6.0
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  W64DEVKIT_TAG: v2.6.0
  W64DEVKIT_ASSET: w64devkit-x64-2.6.0.exe
  MAKE_VERSION: 4.4.1

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install gh cli
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Download w64devkit v2.6.0
        run: |
          gh release download $env:W64DEVKIT_TAG `
            --repo skeeto/w64devkit `
            --pattern $env:W64DEVKIT_ASSET `
            -O w64devkit-sfx.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract w64devkit
        run: |
          .\w64devkit-sfx.exe -o".\w64devkit" -y
          echo "$PWD\w64devkit\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build GNU Make
        shell: cmd
        run: |
          call build_w32.bat --without-guile gcc
          strip -s GccRel\gnumake.exe

      - name: Smoke test
        run: |
          .\GccRel\gnumake.exe --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gnumake-${{ env.MAKE_VERSION }}-x64
          path: GccRel/gnumake.exe

      - name: Create & upload Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $tag = $env:GITHUB_REF -replace 'refs/tags/',''
          gh release create $tag `
            --title "GNU Make $env:MAKE_VERSION (w64devkit v2.6.0)" `
            --notes "Automatically built on GitHub Actions" `
            --clobber `
            GccRel\gnumake.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
