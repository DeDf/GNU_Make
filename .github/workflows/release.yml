name: Build and Release GNU Make

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 下载 w64devkit 自解压包（已确认资产名含 .7z）
      - name: Download w64devkit
        shell: pwsh
        run: |
          gh release download $env:W64DEVKIT_TAG `
            --repo skeeto/w64devkit `
            --pattern $env:W64DEVKIT_ASSET `
            -O w64devkit-sfx.exe
        env:
          W64DEVKIT_TAG: v2.6.0
          W64DEVKIT_ASSET: w64devkit-x64-2.6.0.7z.exe
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 解压自解压 7z 包，把 bin 加入 PATH
      - name: Extract w64devkit
        shell: pwsh
        run: |
          $out = "${{ github.workspace }}\w64devkit"
          try {
            # 7z 自解压风格参数：-y 全部确认，-o 输出目录（-o 后无空格）
            Start-Process -FilePath .\w64devkit-sfx.exe -ArgumentList "-y", "-o$out" -Wait -ErrorAction Stop
          } catch {
            Write-Host "Self-extract failed, fallback to 7z"
            7z x .\w64devkit-sfx.exe -o"$out" -y
          }
          if (-not (Test-Path "$out\bin")) { throw "w64devkit\bin not found after extraction" }
          echo "$out\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # 你的编译命令
      - name: Build gnumake
        shell: cmd
        run: |
          .\build_w32.bat --without-guile gcc
          strip -s GccRel\gnumake.exe

      # 发布到 Release
      - name: Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: GccRel/gnumake.exe
          generate_release_notes: true